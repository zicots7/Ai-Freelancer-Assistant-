apiVersion: apps/v1
kind: Deployment
metadata:
  name: MilestoneRiskPredictor-deployment
  namespace: AiFreelancerAssistant
  labels:
    app: MilestoneRiskPredictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: MilestoneRiskPredictor
  template:
    metadata:
      labels:
        app: MilestoneRiskPredictor
    spec:
      containers:
        - name: MilestoneRiskPredictor
          image: 'zico7/ai_freelancer_assistant:MilestoneRiskPredictor'
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: MilestoneRiskPredictor-service
  namespace: AiFreelancerAssistant
spec:
  selector:
    app: MilestoneRiskPredictor
  ports:
  - port: 8082
    targetPort: 8082