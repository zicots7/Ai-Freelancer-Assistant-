name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Create .env File
        run: |
          cat > .env << EOF
          EOF
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push with Compose
        run: |
          docker compose build
          docker compose push

      - name: Smart Proposal Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_SMART_PROPOSAL_HOOK }}
      - name: Milestone Risk Analysis Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_MILESTONE_RISK_ANALYSIS_HOOK }}

      - name: Smart Invoice Dispute Analyser Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_SMART_INVOICE_DISPUTE_ANALYSER_HOOK }}
          
