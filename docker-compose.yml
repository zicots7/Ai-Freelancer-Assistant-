networks:
  AiFreelancerAssitant:
    driver: bridge

services: 
  SmartProposal:
    image: zico7/ai_freelancer_assistant:SmartProposal 
    build: 
      context: ./SmartProposal/SmartProposal
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    env_file:
      - ./.env  
    networks:
      - AiFreelancerAssitant
  MileStoneRiskPredictor:
    image: zico7/ai_freelancer_assistant:MileStoneRiskPredictor 
    build: 
      context: ./MileStoneRiskPredictor/MileStoneRiskPredictor
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ./.env  
    networks:
      - AiFreelancerAssitant
  SmartInvoiceDisputeAnalyser:
    image: zico7/ai_freelancer_assistant:SmartInvoiceDisputeAnalyser 
    build: 
      context: ./SmartInvoiceDisputeAnalyser/SmartInvoiceDisputeAnalyser
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - ./.env  
    networks:
      - AiFreelancerAssitant
